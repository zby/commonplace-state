purpose: "Agents and maintainers who design or operate Commonplace's grounding review should understand that a note's step size is relative to the check that reads it, what the grounding check's cost unit is, and why the bound is placed on the artifact, with the placement's limits stated where the claims are made."
must-keep:
  - "A step is atomic relative to a particular check."
  - "These are different quantities set by different mechanisms, and a note can satisfy one and fail the other."
  - "N is a convention, chosen so that a second checker — including a person — can redo the step."
passes: []
stop: "Claims are wrong or unsupported, and the corrections change a term dependents rely on. (1) The unit claim 'A source that has been quoted verbatim is not one of them' is defeated by a partly quoted source whose unquoted attributions still require opening it (premise decomposition, kb/reports/state/review/results/kb/theory/a-note-is-an-atomic-step-relative-to-the-check-that-reads-it.md/kb/instructions/premise-decomposition-gate.md); the unit should become the unquoted attribution. (2) 'an absence of that kind is a validator's result rather than a reviewer's finding' is unsupported: the ADR 046 validator checks only quotes that exist (critique, kb/reports/state/review/results/kb/theory/a-note-is-an-atomic-step-relative-to-the-check-that-reads-it.md/kb/instructions/critique-note.md; composition friction, kb/reports/state/review/results/kb/theory/a-note-is-an-atomic-step-relative-to-the-check-that-reads-it.md/kb/instructions/composition-friction-gate.md). (3) 'An artifact-side bound does not have that failure mode' overclaims; the experiment rereading recruits two of four findings as if all four; 'no observed loss' is read as capacity evidence the assay cannot give. Dependents relying on the unit and artifact-side placement: kb/reference/adr/082-grounding-is-bounded-on-the-artifact-by-unquoted-sources.md, kb/reference/proposals/archive/atomic-step-grounding-bounds-unquoted-sources-per-note.md, kb/theory/a-linked-note-discharges-its-own-grounding-so-a-citing-note-owes.md (also duplicates the 344/eight corpus count); role report run directory kb/reports/state/review/runs/v2/revise/kb/theory/a-note-is-an-atomic-step-relative-to-the-check-that-reads-it/0ab4dcfcce1b/role. Also stale: Scope and footer call ADR 079's review-side budget 'currently in force' and leave the validator rule undecided, while accepted ADR 082 decides it. Route: commonplace-review run rewrite kb/theory/a-note-is-an-atomic-step-relative-to-the-check-that-reads-it.md --commission FILE, with the commission prepared with cp-skill-write-multistage; the operator decides the dependents' changes."
