purpose: "A KB maintainer or agent who reads or makes a claim that a process is automated can tell whether a human wait was removed, a specified human task still remains, or a requirement was retired, and so can state what the claim covers."
must-keep:
  - "Removing a human approval wait and removing a specified evaluation task are different changes."
  - "A specified task can remain undone while execution continues."
  - "The process depends on human intervention even if the maintainer always approves."
  - "Retiring an unnecessary review may be justified, but it is a change in requirements, not automation of that review."
passes: []
stop: "Claim-level change and restructuring needed before passes. (1) The critique report (kb/reports/state/review/results/kb/theory/evaluation-that-controls-adoption-helps-determine-the-change.md/kb/instructions/critique-note.md) proposes a different claim: 'A claim of full automation must say which tasks it preserves and which requirements it retires' and 'Calling the whole process automated would conceal an omitted task' need a stated condition under which a specification is authoritative (owner, reviewed changes, specs the automated process can edit). The composition-friction report rates both joints THIN. (2) The critique and premise-decomposition (kb/reports/state/review/results/kb/theory/evaluation-that-controls-adoption-helps-determine-the-change.md/kb/instructions/premise-decomposition-gate.md) reports ask the operator to classify or exclude unwritten relied-on tasks and exception-path waits. (3) The synthesis (kb/reports/state/review/runs/v2/revise/kb/theory/evaluation-that-controls-adoption-helps-determine-the-change/41c2fb951598/synthesis) proposes restructuring around the three roles; it leaves to the author which contrast is the thesis. Route: commonplace-review run rewrite kb/theory/evaluation-that-controls-adoption-helps-determine-the-change.md --commission FILE, with the commission prepared by cp-skill-write-multistage. A title change reaches the only dependent, the index entry in kb/theory/README.md (role report: kb/reports/state/review/runs/v2/revise/kb/theory/evaluation-that-controls-adoption-helps-determine-the-change/41c2fb951598/role)."
