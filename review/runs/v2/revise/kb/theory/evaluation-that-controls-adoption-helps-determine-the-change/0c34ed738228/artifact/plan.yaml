purpose: "A KB maintainer or agent attributing a system's improvement should be able to tell which evaluator judgments count as contributions to selecting a revision and which only assess a revision already in use."
must-keep:
  - "The difference is what the judgment controls, not whether a person or a program makes it."
  - "An evaluator who only assesses an already-adopted change does not, through that assessment alone, determine its adoption."
  - "A favorable assessment of a proposal that is never adopted does not establish an improvement of the deployed system."
passes: []
stop: "The central claim's support is disputed, so no text pass should run. Claim: 'A human approval required for adoption is part of the process that selected the revision.' The same step recurs in 'Whether approval was required for that adoption is a fact about the process. A different description cannot turn required approval into assessment after adoption.' The critique (kb/reports/state/review/results/kb/theory/evaluation-that-controls-adoption-helps-determine-the-change.md/kb/instructions/critique-note.md) proposes a different claim. Either make selection conditional on a verdict that could have gone otherwise, or restate the claim as one about adoption authority. Also fix the examined transition in the declared comparison, since rollback authority counts as selection under a boundary-defined successor. The premise decomposition (kb/reports/state/review/results/kb/theory/evaluation-that-controls-adoption-helps-determine-the-change.md/kb/instructions/premise-decomposition-gate.md) rates the gate premise DOUBTFUL and adds the authors of standing adoption rules as an unnamed selection role. The composition-friction check (kb/reports/state/review/results/kb/theory/evaluation-that-controls-adoption-helps-determine-the-change.md/kb/instructions/composition-friction-gate.md) rates the requirement-to-selection step UNSUPPORTED. Route: commonplace-review run rewrite kb/theory/evaluation-that-controls-adoption-helps-determine-the-change.md --commission FILE, with the commission prepared with cp-skill-write-multistage. Dependent (role report kb/reports/state/review/runs/v2/revise/kb/theory/evaluation-that-controls-adoption-helps-determine-the-change/0c34ed738228/role): kb/theory/README.md cites the title and the supplement gloss, so a title or framing change must update that entry."
