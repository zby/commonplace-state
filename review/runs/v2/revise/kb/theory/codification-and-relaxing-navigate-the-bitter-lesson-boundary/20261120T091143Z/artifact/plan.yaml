purpose: "For KB maintainers and agents deciding whether to commit a rule to code or leave it to a model call: grasp the codify-and-relax claim and the bet framing (each code extraction bets that what it commits is spec, not accident; relax when scale makes a general component viable) and follow it without decoding repeated caveats or two unmapped names for one distinction."
must-keep:
  - "Practical systems will always be hybrids, and this is not a partition into codified versus learned."
  - "Every code-extraction codification is a bet that what was extracted is genuinely part of the spec rather than an accidental pattern that holds on observed data."
  - "The replacement can itself be codified by adoption; what relaxing reverses is the extraction, not symbolic membership."
  - "The bitter lesson describes a trajectory, not a law of nature."
passes:
  - pass: fix-strategy-taxonomy
    scope: "The trade-off paragraph sentence introducing 'the arithmetic/vision-feature boundary' and the lead-ins of the two regime bullets: map arithmetic regime to exact spec and vision-feature regime to proxy theory once, keeping both names. Not the vision-researcher paragraph."
    finding: kb/reports/state/review/results/kb/theory/codification-and-relaxing-navigate-the-bitter-lesson-boundary.md/prose/source-residue.md
  - pass: readability-and-flow
    scope: "Only: the opening paragraph's last sentence ('This is not a partition into codified versus learned…'), the codification-definition paragraph under 'The trade-off depends on which regime you're in', the relaxing-definition sentence ('Code extraction therefore has a complement: …'), and heuristic 1's last sentence ('Merely writing the convention…'). State the model-package-adoption and prose-convention caveats once in the definition paragraph, moving the constrains-without-codifying contrast there with a link to definitions/constraining.md; keep the hybrid-not-partition point; split the relaxing definition so its trade-off is its own sentence. Leave the opening premise sentence, the bet section, the evidence paragraphs, heuristics 2-3, the description and the footers untouched."
stop: null
