purpose: "An agent or maintainer who reports or designs the automation of a KB or agent process should be able to tell removing a human approval wait apart from automating or retiring a required human task and from optional assessment, and say which human tasks an automation claim keeps and which requirements it retires."
must-keep:
  - "Removing a human approval wait and removing a specified evaluation task are different changes."
  - "Retiring an unnecessary review may be justified, but it is a change in requirements, not automation of that review."
passes:
  - pass: narrow-overclaims
    scope: "The opening paragraph's sentence \"A claim of full automation must say which tasks it preserves and which requirements it retires.\" only"
  - pass: abstractions
    scope: "The whole note except the weekly-review paragraph under \"Name the process being automated\" (the paragraph beginning \"Suppose adoption is automatic\") and the second Scope bullet (\"A habitual wait for human input ...\")"
stop: null
