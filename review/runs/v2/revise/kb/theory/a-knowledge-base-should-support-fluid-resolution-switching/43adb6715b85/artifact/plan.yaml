purpose: "Agents and maintainers designing KB navigation (indexes, link context, descriptions, search) should be able to use resolution-switching as a criterion that rejects specific design choices that retrieval accuracy and addressability grain would accept."
must-keep:
  - "Resolution here means the scope and detail exposed by a view, not an intrinsic abstraction rank assigned to an artifact."
  - "Resolution-switching is not the same as addressability grain."
  - "A system may retrieve the right detailed artifact yet make its wider context hard to recover."
  - "Resolution-switching helps a reader assemble those views; it does not perform the recognition or guarantee a discovery."
passes: []
stop: "Unsupported claim: 'A detailed artifact should leave a discoverable route back to wider organizing context.' It has no ground beyond readers alternating between views (composition-friction UNSUPPORTED, kb/reports/state/review/results/kb/theory/a-knowledge-base-should-support-fluid-resolution-switching.md/kb/instructions/composition-friction-gate.md). Because the note accepts search as a route back, it is near-vacuous for any searchable KB (premise-decomposition DOUBTFUL, kb/reports/state/review/results/kb/theory/a-knowledge-base-should-support-fluid-resolution-switching.md/kb/instructions/premise-decomposition-gate.md). The critique (kb/reports/state/review/results/kb/theory/a-knowledge-base-should-support-fluid-resolution-switching.md/kb/instructions/critique-note.md) conditionally proposes a different, weaker claim: a named bundle of existing properties evaluated at transitions, unless a separating case is supplied. The explanatory-reach and claim-strength warns also call for a claim change: the 'should' has no trade-off or failure condition. Route: commonplace-review run rewrite kb/theory/a-knowledge-base-should-support-fluid-resolution-switching.md --commission FILE, with the commission prepared with cp-skill-write-multistage. Narrowing the link-context claim ('preserve the task-relative relationship') reaches kb/sources/i-like-em-thick.ingest.md. A change to the term or its view-relative sense reaches kb/theory/areas-exist-because-useful-operations-require-reading-notes-together.md, kb/sources/gwern-design-of-this-website.ingest.md, kb/sources/i-like-em-thick.ingest.md and kb/sources/creative-thinking-by-claude-shannon.ingest.md (role report: kb/reports/state/review/runs/v2/revise/kb/theory/a-knowledge-base-should-support-fluid-resolution-switching/43adb6715b85/role)."
