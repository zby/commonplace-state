purpose: "Machine-learning and agent-systems researchers who do not know Commonplace should be able to state the article's two-level claim (deliberative learning as a learning paradigm with a judgment in the selection role, and the bet that a fixed-weight language model can fill that judge role), follow it without internal vocabulary, and see what evidence would decide the bet."
must-keep:
  - "Deliberative learning (a system learning by making proposed, rejectable edits to its own readable, addressable store) is a distinct learning paradigm."
  - "When no single formula captures the work, an on-balance judgment works in place of a value function inside the loop."
  - "We bet that a fixed-weight language model can fill the judge slot autonomously, running double-loop deliberative learning with targeted correction for work where no fixed criterion is adequate."
  - "The Bitter Lesson contrasts human-supplied knowledge with knowledge produced by computation through search and learning; it says nothing about whether the retained result must live in floating-point weights."
  - "We report no completed end-to-end automated run demonstrating sustained autonomous double-loop learning yet."
  - "Legibility does not guarantee faithfulness: a written rule need not be what actually drove the model's behavior."
passes:
  - pass: narrow-overclaims
    scope: "Two passages only. (1) In 'Deliberative learning versus training weights', the three-payoffs paragraph: the sentences 'Adaptation takes effect immediately at deployment time ...' and 'Retained knowledge is inspectable now ...'. Narrow them to what the linked deployment-time-adaptation and inspectability notes state: lifecycle phase is not latency, and inspection is affordable but not unconditional. (2) In 'Proof, formula, judgment', the Goedel machine paragraph: 'formal optimality guarantee', 'every self-rewrite requires' and 'no general real-world domain has the full axiomatization required'. Do not touch the PRODIGY, EURISKO or on-balance paragraphs, or the section's opening 'bottleneck was always' sentence."
  - pass: fix-strategy-taxonomy
    scope: "The WARN items only: 'type contract' and 'temporary workshop' in 'One change followed through'."
    finding: kb/reports/state/review/results/kb/articles/deliberative-learning-judgment-in-place-of-a-value-function.md/accessibility/undefined-terms.md
  - pass: fix-strategy-taxonomy
    scope: "The WARN items only: identify Commonplace at its first mention ('as Commonplace currently is') as the authors' agent-operated knowledge-base framework, and gloss EURISKO at its first mention. Leave the rest of the EURISKO paragraph unchanged."
    finding: kb/reports/state/review/results/kb/articles/deliberative-learning-judgment-in-place-of-a-value-function.md/accessibility/unidentified-references.md
  - pass: fix-strategy-taxonomy
    scope: "Only the sentence 'An unknown is worth investigating only if a plausible answer could reverse the choice.' in the on-balance paragraph."
    finding: kb/reports/state/review/results/kb/articles/deliberative-learning-judgment-in-place-of-a-value-function.md/kb/instructions/compression-bundle/branch-bloat.md
  - pass: fix-strategy-taxonomy
    scope: "The three WARN items only. (1) Fold the three-payoffs paragraph into the table or into one sentence that introduces the cost ledger. Keep both of its links and the qualifications narrow-overclaims left on it, and leave the table rows' claims unchanged. (2) The sentence 'Treating the paradigm as already validated would invert the order of proof.' (3) The launchpad/ceiling sentence after the bootstrap condition. Keep the hazard bullet 'Unfaithful rationales'; the falsification clause names it."
    finding: kb/reports/state/review/results/kb/articles/deliberative-learning-judgment-in-place-of-a-value-function.md/kb/instructions/compression-bundle/marginal-value-redundancy.md
  - pass: fix-strategy-taxonomy
    scope: "Only the sentence ending 'pure triggers that write on a count without judging what was written all fail the second': reorder it so the verb comes before the list."
    finding: kb/reports/state/review/results/kb/articles/deliberative-learning-judgment-in-place-of-a-value-function.md/sentence/clause-packing.md
  - pass: fix-strategy-taxonomy
    scope: "The two WARN link texts: 'inspectability as a property of form' and 'a plausible written rule need not be what actually drove the model's behavior'. Keep both link targets."
    finding: kb/reports/state/review/results/kb/articles/deliberative-learning-judgment-in-place-of-a-value-function.md/sentence/misleading-link-text.md
  - pass: fix-strategy-taxonomy
    scope: "Only the list 'Once the alternative, whose costs count, and the horizon are fixed' in the on-balance paragraph. Do not touch the Harness Evolution sentence."
    finding: kb/reports/state/review/results/kb/articles/deliberative-learning-judgment-in-place-of-a-value-function.md/sentence/parsing-ambiguity.md
  - pass: fix-strategy-taxonomy
    scope: "The two WARN sentences only: 'The structural contrast with weight training is starkest when laid side by side:' and 'This is where the second level of our thesis—the machine learning bet—enters.'"
    finding: kb/reports/state/review/results/kb/articles/deliberative-learning-judgment-in-place-of-a-value-function.md/sentence/stock-phrases.md
