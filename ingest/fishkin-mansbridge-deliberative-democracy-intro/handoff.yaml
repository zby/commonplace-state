occasion: 'The workshop draft kb/work/learning-method-name/draft-definition.md defines
  "deliberative learning" and needs the established group sense of deliberation. The
  ingest should let a reader check: (1) the authors'' definition of deliberation,
  including "weighing" competing arguments; (2) the conditions they attach (good information,
  balance, diversity, civility, reasons given); (3) whether a group is required by
  their definition; (4) what they say deliberation produces (considered judgments,
  changed opinions, learning) and whether any of it is retained beyond the participants;
  (5) what they name as criticisms or failure modes of deliberation.'
