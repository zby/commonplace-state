occasion: 'The workshop draft kb/work/learning-method-name/draft-definition.md (section
  "The name", bullet "Deliberative agents") defines "deliberative learning" and compares
  it with the established term "deliberative agent". The ingest should let a reader
  check: (1) the paper''s definition of a deliberative agent or architecture, in its
  own words; (2) how it contrasts deliberative with reactive and hybrid architectures;
  (3) what decides the agent''s choice of action (logical reasoning, goal test, utility)
  and whether that standard is fixed by the designer; (4) the problems it names for
  the symbolic approach; (5) whether it says anything about learning or about the
  agent revising its own model.'
