purpose: "A reader of the continual-learning article, or an agent designing a selection-based learner, should understand why credit assignment over a retained store is a debugging problem rather than a gradient problem, which three properties make a prose-and-code store harder to debug than software, and which levers keep it debuggable, without being told those levers are stronger than they are."
must-keep:
